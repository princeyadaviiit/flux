name: Publish Packages to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm tag (e.g. latest, beta)'
        required: true
        default: 'latest'
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Tests
        run: npm test

      - name: Build all packages
        run: npm run build:packages

      - name: Publish @flux/core
        run: npm publish --workspace=packages/core --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Framework Adapters
        run: |
          npm publish --workspace=packages/react --access public --tag ${{ github.event.inputs.tag || 'latest' }}
          npm publish --workspace=packages/vue --access public --tag ${{ github.event.inputs.tag || 'latest' }}
          npm publish --workspace=packages/svelte --access public --tag ${{ github.event.inputs.tag || 'latest' }}
          npm publish --workspace=packages/solid --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @flux/cli
        run: npm publish --workspace=packages/cli --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-flux
        run: npm publish --workspace=packages/create-flux --access public --tag ${{ github.event.inputs.tag || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
